[package]
name = "overleaf-mount"
version = "0.1.0"
edition = "2021"
description = "Mount an Overleaf project as a FUSE filesystem with live OT synchronisation"
license = "AGPL-3.0-or-later"

[dependencies]
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
    "net",
    "process",
    "fs",
    "io-util",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "multipart",
] }
url = "2"
ignore = "0.4"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
tempfile = "3"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = false
lto = "thin"
